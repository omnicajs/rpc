name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Run actionlint
        run: make actionlint

  eslint:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-version }}
          cache-key-suffix: tests-eslint

      - name: Run lint
        run: yarn lint

  typecheck:
    runs-on: ubuntu-24.04

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: tests-typecheck

      - name: Run typecheck
        run: yarn typecheck

  tests:
    needs: [actionlint, eslint, typecheck]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ matrix.node-version }}
          cache-key-suffix: tests-coverage

      - name: Run tests without coverage on Node.js 22
        if: matrix.node-version == '22.x'
        run: yarn test

      - name: Run tests with coverage on Node.js 24
        if: matrix.node-version == '24.x'
        run: yarn test:coverage

      - name: Upload coverage artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-24.x
          path: coverage/
          retention-days: 30

  e2e:
    needs: [actionlint, eslint, typecheck]

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: tests-e2e

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox --with-deps

      - name: Run browser e2e tests with coverage
        run: yarn test:e2e:coverage

      - name: Upload e2e coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-24.x
          path: coverage/playwright/
          retention-days: 30

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            artifacts/
            .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    needs: [tests, e2e]

    permissions:
      contents: read
      pull-requests: write
      actions: read

    runs-on: ubuntu-24.04

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: coverage-merge

      - name: Download unit coverage artifact
        uses: actions/download-artifact@v6
        with:
          name: coverage-unit-24.x
          path: coverage-input/unit/

      - name: Download e2e coverage artifact
        uses: actions/download-artifact@v6
        with:
          name: coverage-e2e-24.x
          path: coverage-input/e2e/

      - name: Merge coverage reports
        run: |
          node scripts/coverage-merge.mjs \
            --out coverage-merged \
            coverage-input/unit/coverage-final.json \
            coverage-input/e2e/coverage-final.json

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged-24.x
          path: coverage-merged/
          retention-days: 30

      - name: Download base branch merged coverage
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: tests.yml
          branch: ${{ github.base_ref }}
          name: coverage-merged-24.x
          path: coverage-base/
          if_no_artifact_found: warn

      - name: Detect base branch coverage
        id: base-coverage
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage-base/coverage-summary.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write merged coverage summary
        run: |
          node scripts/coverage-summary.mjs \
            --current coverage-merged/coverage-summary.json \
            --base coverage-base/coverage-summary.json \
            --title "Combined Coverage" \
            --baseLabel "base branch merged coverage artifact"

      - name: Report merged coverage in PR with base comparison
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.available == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage-merged/coverage-summary.json
          json-final-path: coverage-merged/coverage-final.json
          json-summary-compare-path: coverage-base/coverage-summary.json

      - name: Report merged coverage in PR without base comparison
        if: github.event_name == 'pull_request' && steps.base-coverage.outputs.available != 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage-merged/coverage-summary.json
          json-final-path: coverage-merged/coverage-final.json

  build:
    needs: [actionlint, eslint, typecheck]

    runs-on: ubuntu-24.04

    steps:
      - name: Using branch ${{ github.ref }} for repository ${{ github.repository }}.
        uses: actions/checkout@v6

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 24.x
          cache-key-suffix: tests-build

      - name: Build package
        run: yarn build

      - name: Verify build artifacts
        run: |
          test -f dist/index.mjs || (echo "Missing dist/index.mjs" && exit 1)
          test -f dist/index.cjs || (echo "Missing dist/index.cjs" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)
